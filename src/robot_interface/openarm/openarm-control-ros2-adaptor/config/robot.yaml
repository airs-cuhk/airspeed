can_left: can0
can_right: can1
can_interface: socketcan
left_joints:
- openarm_left_joint1
- openarm_left_joint2
- openarm_left_joint3
- openarm_left_joint4
- openarm_left_joint5
- openarm_left_joint6
- openarm_left_joint7
- openarm_left_gripper
right_joints:
- openarm_right_joint1
- openarm_right_joint2
- openarm_right_joint3
- openarm_right_joint4
- openarm_right_joint5
- openarm_right_joint6
- openarm_right_joint7
- openarm_right_gripper
gripper_open_deg: -65.0
# Physical OpenArm gripper motors. Set a side to false when that gripper has
# been removed and replaced by an external dexterous hand (ROH session) — the
# gripper motor is then skipped everywhere (bus build, gripper test, commands).
left_gripper_enabled: false
right_gripper_enabled: false
kp:
  # Retune (2026-08-12, tested on 115): the 75/12/40/12 wrist-stiff tune shook
  # on the ROH payload (docs/arm-startup-trembling-analysis-20260811.md).
  # J1-J4 cut 75 -> 60, J6 cut 40 -> 24 (dominant ringer), J5/J7 raised
  # 12 -> 24 to hold wrist pose with less J6 dominance, gripper 12 -> 8.
  # kd re-derived by the damping-ratio rule kd ~ zeta*sqrt(kp) so each joint
  # keeps the same damping as before. If following feels too soft, raise
  # J1-J4 back toward 65-70 first.
  joint_1: 60.0
  joint_2: 60.0
  joint_3: 60.0
  joint_4: 60.0
  joint_5: 24.0
  joint_6: 24.0
  joint_7: 24.0
  gripper: 8.0
kd:
  # Damiao MIT protocol caps kd at 5.0 (12-bit wire range). Values here go
  # on the wire verbatim; startup validation rejects anything out of range.
  # kd = zeta * sqrt(kp) with zeta preserved from the previous tune.
  joint_1: 4.5
  joint_2: 4.5
  joint_3: 4.5
  joint_4: 4.5
  joint_5: 1.8  # zeta 0.375 held from kp 12 / kd 1.3
  joint_6: 2.1  # zeta 0.42 held from kp 40 / kd 2.7
  joint_7: 1.8  # zeta 0.375 held from kp 12 / kd 1.3
  gripper: 0.8  # zeta 0.29 held from kp 12 / kd 1.0
arm_state_hz: 50
# Per-cycle slew clamp. At 50 Hz, 1.8 deg/cycle keeps the effective speed
# limit at 90 deg/s (same envelope as 3.0 deg/cycle at 30 Hz).
max_joint_delta_deg: 1.8
max_gripper_delta_deg: 10.0
stream_timeout_s: 0.5
return_home_seconds: 3.0
ws_uri: ws://localhost:5200/ws/arm
urdf_path: urdf/openarm_bimanual_pybullet.urdf
